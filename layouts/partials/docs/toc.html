{{- /* Right-hand "On this page" TOC. Rendered only when front matter
       toc: true and the page actually has a TOC. */ -}}
{{- if and (.Params.toc | default false) (gt (len .TableOfContents) 0) }}
<aside class="hd-toc" aria-label="{{ i18n "onThisPage" | default "On this page" }}">
  <div class="hd-toc-head">
    <p class="hd-toc-title">{{ i18n "onThisPage" | default "On this page" }}</p>
    <button class="hd-toc-toggle hd-iconbtn secondary outline" aria-expanded="true"
            aria-label="{{ i18n "tocToggle" | default "Toggle table of contents" }}"
            title="{{ i18n "tocToggle" | default "Toggle table of contents" }}">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </button>
  </div>
  <nav>
    {{ .TableOfContents }}
  </nav>
</aside>
{{- end -}}
