<header class="hd-header">
  <nav class="container" aria-label="Main">
    <ul>
      <li>
        <a class="hd-brand" href="{{ site.Home.RelPermalink }}">
          {{- with site.Params.brand.icon }}
            {{- if strings.HasSuffix . ".svg" }}
              {{- with resources.Get . }}<img class="hd-brand-icon" src="{{ .RelPermalink }}" alt="">{{ end }}
            {{- else }}
              {{- partial "hd-icon.html" . }}
            {{- end }}
          {{- end }}
          {{ site.Title }}
        </a>
      </li>
    </ul>
    <ul>
      {{ range site.Menus.primary -}}
      <li><a href="{{ .URL | relURL }}"{{ if .Page }} class="contrast"{{ end }}{{ if strings.HasPrefix .URL "http" }} rel="noopener"{{ end }}>{{ .Name }}</a></li>
      {{ end -}}
      <li>
        <button id="hd-search-open" class="hd-search-trigger secondary outline" aria-keyshortcuts="Control+K Meta+K">
          {{ partial "hd-icon.html" "search" }} {{ i18n "search" | default "Search" }} <kbd>Ctrl K</kbd>
        </button>
      </li>
      <li>
        <button id="hd-theme-toggle" class="hd-iconbtn secondary outline" aria-label="{{ i18n "themeToggle" | default "Toggle dark/light theme" }}">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.3 11.3 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </li>
    </ul>
  </nav>
</header>
