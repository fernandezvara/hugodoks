<dialog id="hd-search-dialog" aria-label="{{ i18n "search" | default "Search" }}">
  <article>
    <header>
      <input id="hd-search-input" type="search" placeholder="{{ i18n "searchPlaceholder" | default "Search documentation…" }}" aria-label="{{ i18n "search" | default "Search" }}" autocomplete="off">
    </header>
    <ul id="hd-search-results" class="hd-search-results" role="listbox"></ul>
    <p id="hd-search-empty" class="hd-search-empty" hidden>{{ i18n "searchNoResults" | default "No results found." }}</p>
  </article>
</dialog>
